{{define "delete.html"}}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Delete go/{{.Shortcut}}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main>
    {{template "header"}}
    <section class="confirmation">
      <h2>Delete shortcut</h2>
      <p>Delete <strong>go/{{.Shortcut}}</strong>?</p>
      <p class="destination">{{.DestinationURL}}</p>
      <form method="post">
        <button class="danger" type="submit">Delete shortcut</button>
        <a class="cancel" href="/">Cancel</a>
      </form>
    </section>
  </main>
</body>
</html>
{{end}}
