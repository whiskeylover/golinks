{{define "edit.html"}}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Edit go/{{.Shortcut}}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main>
    <header>
      <a href="/">go/links</a>
      <h1>Edit go/{{.Shortcut}}</h1>
    </header>
    {{if .Error}}<p class="error" role="alert">{{.Error}}</p>{{end}}
    <form method="post">
      <label for="destination_url">Destination URL</label>
      <input id="destination_url" name="destination_url" type="url" value="{{.DestinationURL}}" placeholder="https://example.com" required autofocus>
      <button type="submit">Save link</button>
    </form>
  </main>
</body>
</html>
{{end}}
