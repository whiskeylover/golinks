{{define "edit.html"}}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Edit go/{{.Shortcut}}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main>
    {{template "header"}}
    {{if .Error}}<p class="error" role="alert">{{.Error}}</p>{{end}}
    {{if .Message}}<p class="message">{{.Message}}</p>{{end}}
    <form action="/edit/{{.Shortcut}}" method="post">
      <span class="prefix">go/</span>
      <input aria-label="Shortcut" class="shortcut-input" id="shortcut" value="{{.Shortcut}}" disabled>
      <span aria-label="redirects to" class="redirect-arrow" role="img">&rarr;</span>
      <input aria-label="Destination URL" id="destination_url" name="destination_url" type="url" value="{{.DestinationURL}}" placeholder="https://example.com" required autofocus>
      <button type="submit">Save</button>
    </form>
  </main>
</body>
</html>
{{end}}
